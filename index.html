<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מרתון תל אביב 2027</title>
<meta name="description" content="תוכנית האימונים של עמית למרתון תל אביב 2027">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מרתון">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F5F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F181C" media="(prefers-color-scheme: dark)">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: phone app shell. Sticky app bar, one scrolling view, fixed bottom tab bar. Sea-and-shore palette from the existing plan. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#13232B; --muted:#5B6D75; --line:#D6E0E3;
  --accent:#0E6E8C; --accent-soft:#DCEEF3; --on-accent:#FFFFFF; --race:#C8531F; --race-soft:#FBE7DD;
  --easy:#3F8F5E; --q:#B8322F; --long:#0E6E8C; --cf:#7A5AA8; --swim:#1C8FB0; --rest:#8A989E;
  --bar:rgba(242,245,246,.88); --scrim:rgba(10,22,28,.45); --tabh:62px;
  --f-display:"Secular One","Rubik",Arial,sans-serif; --f-body:"Rubik",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F181C; --surface:#172329; --ink:#E6EEF1; --muted:#96A8AF; --line:#2A3A41;
  --accent:#4DB3D3; --accent-soft:#16333D; --on-accent:#0F181C; --race:#F08A5A; --race-soft:#3A2419;
  --easy:#6CC08B; --q:#EE7471; --long:#4DB3D3; --cf:#A98DD6; --swim:#5CC3E0; --rest:#71838A;
  --bar:rgba(15,24,28,.88);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F181C; --surface:#172329; --ink:#E6EEF1; --muted:#96A8AF; --line:#2A3A41;
  --accent:#4DB3D3; --accent-soft:#16333D; --on-accent:#0F181C; --race:#F08A5A; --race-soft:#3A2419;
  --easy:#6CC08B; --q:#EE7471; --long:#4DB3D3; --cf:#A98DD6; --swim:#5CC3E0; --rest:#71838A;
  --bar:rgba(15,24,28,.88);
}
*{box-sizing:border-box}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;direction:rtl;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
svg{display:block}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:18px;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.ring{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

main{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:grid;gap:20px}

/* day header */
.dayhead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;text-align:center}
.nav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:20px;height:20px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.dayhead h1{font-size:clamp(26px,7vw,32px);line-height:1.15}
.meta{font-size:13px;color:var(--muted)}
.back{justify-self:center;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:5px 14px}

/* workout cards */
.cards{display:grid;gap:10px}
.wo{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .2s,background .2s}
.wo-main{width:100%;text-align:right;display:grid;grid-template-columns:44px 1fr 32px;gap:12px;align-items:center;padding:16px 14px}
.wo-foot{border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px;min-height:42px}
.logsum{flex:1;min-width:0;color:var(--ink)}
.logbtn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;padding:4px 0;margin-inline-start:auto}
.logbtn svg{width:16px;height:16px}
.wo .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--bg)}
.wo .ico svg{width:24px;height:24px}
.wb{display:grid;gap:3px;min-width:0}
.wk{font-weight:600;font-size:13px}
.wt{font-size:16px;line-height:1.45}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.ck svg{width:18px;height:18px}
.wo.done{border-color:var(--easy)}
.wo.done .wt{color:var(--muted)}
.wo.done .ck,.row.done .cb{background:var(--easy);border-color:var(--easy);color:var(--surface)}
.pop .ck,.pop .cb{animation:pop .35s ease-out}
@keyframes pop{40%{transform:scale(1.25)}}
.wo.rest .wo-main{grid-template-columns:44px 1fr;cursor:default}
.wo.racecard{border-color:var(--race);background:var(--race-soft)}
.wo.racecard.done{border-color:var(--easy)}

.k-easy{color:var(--easy)}.k-q{color:var(--q)}.k-long{color:var(--long)}.k-cf{color:var(--cf)}.k-swim{color:var(--swim)}.k-rest{color:var(--rest)}.k-race{color:var(--race)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.sd{display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:10px;font-size:12px;color:var(--muted)}
.sd b{font-weight:600;color:var(--ink);font-size:13px}
.sd i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
.sd.full i{background:var(--easy);border-color:var(--easy)}
.sd.part i{background:linear-gradient(90deg,var(--easy) 50%,transparent 50%);border-color:var(--easy)}
.sd.rest i{border-style:dashed}
.sd.tod b{color:var(--accent)}
.sd.sel{background:var(--accent);color:var(--on-accent)}
.sd.sel b{color:var(--on-accent)}
.sd.sel i{border-color:var(--on-accent)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:6px;align-content:start;min-width:0}
.stat small{font-size:12px;color:var(--muted)}
.stat strong{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1}
.stat strong span.u{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.stat.race{background:var(--race-soft);border-color:var(--race)}
.stat.race strong{color:var(--race)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* week view */
.weekhead{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;text-align:center}
.weekhead h1{font-size:28px}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.tag.r{background:var(--race-soft);color:var(--race)}
.tag.d{border:1px solid var(--line);color:var(--muted);background:transparent}
.wsum{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.wsum .bar{flex:1}
.days{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wday{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.wday:last-child{border-bottom:0}
.wday.today{background:var(--accent-soft)}
.wdn{display:grid;align-content:start;gap:1px;font-size:12px;color:var(--muted);text-align:right}
.wdn b{color:var(--ink);font-weight:500;font-size:14px}
.wday.today .wdn b{color:var(--accent)}
.wits{display:grid;gap:8px;min-width:0}
.row{width:100%;display:flex;gap:8px;align-items:flex-start}
.tog{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;text-align:right}
.cb{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;margin-top:1px}
.cb svg{width:14px;height:14px}
.rt{min-width:0;display:grid;gap:2px}
.row.done .rtx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.rsum{font-size:12px;color:var(--accent)}
.lg{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line)}
.lg svg{width:15px;height:15px}
.lg.has{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.row.rest{cursor:default;color:var(--muted);gap:10px}
.row.rest .cb{border-style:dashed;border-color:transparent}

/* plan view */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{font-size:20px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big strong{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1}
.big span{color:var(--muted);font-size:14px}
.ms{display:grid;gap:8px}
.msr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border-radius:12px;background:var(--race-soft)}
.msr.past{background:var(--bg);color:var(--muted)}
.msr b{font-weight:500}
.msr small{color:var(--muted);font-size:12px}
.msr em{font-style:normal;color:var(--race);font-weight:600;font-size:13px;grid-row:span 2;align-self:center}
.msr.past em{color:var(--muted)}
.chart{overflow-x:auto;margin-inline:-4px}
.chart svg{width:100%;min-width:520px;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px}
.phase{display:grid;gap:8px}
.phase h3{font-size:16px}
.phase p{margin:0;font-size:13px;color:var(--muted);max-width:62ch}
.wrow{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.wrow.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wrow.racewk{border-color:var(--race)}
.wrow .wn{font-family:var(--f-display);font-size:16px;min-width:64px}
.wrow .wd{font-size:12px;color:var(--muted)}
.wrow .wkm{font-weight:600;font-size:14px}
.wrow .bar{grid-column:1/-1}
.foot{font-size:12px;color:var(--muted);margin:0}
.reset{justify-self:start;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.reset.arm,.btn.arm{color:var(--race);border-color:var(--race)}

/* paces */
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:7px;vertical-align:1px}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.rules summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:18px}
details.rules summary::-webkit-details-marker{display:none}
details.rules summary svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
details.rules[open] summary svg{transform:rotate(-90deg)}
details.rules ul{margin:0;padding:0 34px 16px 16px;display:grid;gap:8px;font-size:14px}

/* tab bar */
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:6;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{height:var(--tabh);display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}

/* coach: share + backup */
.coachhead h1{font-size:28px}
.steps{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:14px}
.sumbox{font:inherit;font-size:13px;line-height:1.55;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:160px;max-height:300px;resize:vertical;white-space:pre-wrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border-radius:9px;padding:8px 4px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .btn.pri{grid-column:auto}
.toast{position:fixed;inset-inline:16px;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom,0px));z-index:30;max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;text-align:center;animation:up .2s ease-out}
.note{font-size:13px;color:var(--muted);margin:0}
.hint{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink)}
.hint p{margin:0;flex:1;min-width:0}
.hint button{flex:none;color:var(--accent);font-weight:600;padding:2px 4px}

/* log sheet */
.sheet-bg{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh-head{display:flex;gap:12px;align-items:flex-start}
.sh-head > div{flex:1;min-width:0}
.sh-head h2{font-size:22px}
.sh-head .iconbtn{border:1px solid var(--line);width:38px;height:38px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.fl{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input.in,textarea.in{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input.in:focus,textarea.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.pace{font-size:14px;color:var(--accent);font-weight:500;min-height:1.5em}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.rpe button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rpe-hint{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.sh-act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border-radius:12px;padding:12px 14px;font-weight:600;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent);grid-column:1/-1}
.btn.sec{border:1px solid var(--line)}
.btn.del{border:1px solid var(--line);color:var(--race)}

@media (max-width:380px){.wo{grid-template-columns:38px 1fr 30px;gap:10px;padding:14px 12px}.wo .ico{width:38px;height:38px}.wt{font-size:15px}.wday{grid-template-columns:46px 1fr;padding-inline:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <div class="brand">מרתון תל אביב<small>27.2.2027 · יעד 5:00 לק״מ</small></div>
  <div class="ring"><span id="ovr" class="num" title="אימונים שבוצעו מכל התוכנית">0%</span></div>
</div></header>

<main id="main" aria-live="polite"></main>

<nav class="tabs" aria-label="ניווט"><div class="tabs-in">
  <button class="tab" data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>היום</button>
  <button class="tab" data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>שבוע</button>
  <button class="tab" data-view="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5z"/><path d="M8.5 8.5h7M8.5 11.5h4.5"/></svg>מאמן</button>
  <button class="tab" data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-6"/></svg>תוכנית</button>
  <button class="tab" data-view="pace"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5l3-3M10 3h4M12 3v3"/></svg>קצבים</button>
</div></nav>

<script>
const START = new Date(2026, 8, 27);
const DN = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DS = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const LONG = {easy:'ריצה קלה',q:'אימון איכות',long:'ריצה ארוכה',cf:'קרוספיט',swim:'שחייה',rest:'מנוחה',race:'תחרות'};
const CF = ['cf','קרוספיט'], CFL = ['cf','קרוספיט · פלג גוף עליון וליבה, בלי רגליים כבדות'], SW = ['swim','שחייה קלה 1.5–2 ק״מ, אחה״צ'];

function std(sun, tue, thu, sat, opts={}){
  return [
    [['easy', sun[1], sun[0]]],
    [opts.mon || CF],
    [['q', tue[1], tue[0]]],
    [opts.wed || CF],
    [['easy', thu[1], thu[0]]],
    [opts.fri || CFL],
    [['long', sat[1], sat[0]], SW]
  ];

async function exportBackup(){
  const name = `marathon-backup-${today.getFullYear()}-${pad2(today.getMonth()+1)}-${pad2(today.getDate())}.json`;
  const json = JSON.stringify({app: 'tlv27', v: 1, exported: new Date().toISOString(), done: DONE.data, logs: LOGS.data});

  try {

  const a = document.createElement('a');

function importBackup(file){
  const r = new FileReader();

    let j = null;
    try { j = JSON.parse(r.result); } catch(e) {}
    const okObj = v => v && typeof v === 'object' && !Array.isArray(v);
    if (!j || j.app !== 'tlv27' || !okObj(j.done) || !okObj(j.logs)) { toast('הקובץ הזה לא נראה כמו גיבוי של האפליקציה.'); return; }
    DONE.data = j.done; LOGS.data = j.logs; DONE.save(); LOGS.save();
    render(); toast(`שוחזרו ${Object.keys(j.done).length} סימונים ו־${Object.keys(j.logs).length} תוצאות`);

}

    <tr><td><span class="dot" style="background:var(--easy)"></span>קלה / התאוששות</td><td class="num">5:40–6:10</td></tr>
    <tr><td><span class="dot" style="background:var(--long)"></span>ארוכה (החלק הקל)</td><td class="num">5:35–6:00</td></tr>
    <tr><td><span class="dot" style="background:var(--race)"></span>קצב מרתון</td><td><span class="num">5:10</span> עד דצמבר, <span class="num">5:00</span> מינואר</td></tr>
    <tr><td><span class="dot" style="background:var(--q)"></span>טמפו</td><td class="num">4:40–4:50</td></tr>
    <tr><td><span class="dot" style="background:var(--q)"></span>אינטרוולים 800 מ׳–1 ק״מ</td><td class="num">4:10–4:20</td></tr>
  </table>
  <p class="foot">הקצבים מתעדכנים לפי התוצאות בריצת הלילה ובחצי ים המלח. ק״מ של אימוני איכות כוללים חימום ושחרור של 2–3 ק״מ.</p>
</section>
<section class="panel"><h2>קצבי שחייה ל־100 מ׳</h2>
  <table>
    <tr><th>סוג שחייה</th><th>בריכה</th><th>ים</th></tr>
    <tr><td>קל / התאוששות</td><td class="num">2:30+</td><td class="num">2:50+</td></tr>
    <tr><td>רצוף</td><td class="num">2:25</td><td class="num">2:45</td></tr>
    <tr><td>CSS (סף)</td><td class="num">2:14</td><td>–</td></tr>
    <tr><td>קצב יעד לתחרות</td><td class="num">2:20</td><td class="num">2:40</td></tr>
  </table>
  <p class="foot">נקודת מוצא: 2.9 ק״מ באילת (5.9) בקצב <span class="num">2:59</span> ל־100 מ׳. מבחן CSS בבריכה (3.10): 400 מ׳ ב־<span class="num">8:48</span> (<span class="num">2:12</span>) ו־200 מ׳ ב־<span class="num">4:20</span> (<span class="num">2:10</span>), כלומר CSS של <span class="num">2:14</span>. יעד למשחה הים האדום ב־30.1: <span class="num">1:47</span>, כלומר <span class="num">2:40</span> ל־100 מ׳ בים. היעד ייבדק שוב בשחייה בים בשבוע 4 ובחזרה הגנרלית ב־26.12.</p>
  <p class="foot">בים איטי בכ־20 שניות ל־100 מ׳ לעומת בריכה: אין קירות לדחיפה, צריך להרים ראש לכיוון ויש גלים. בגלל המשחה, הריצה הארוכה של 32 ק״מ הוקדמה לשבוע 17, ושבוע 18 הוא שבוע הורדה בריצה.</p>
</section>
<section class="panel"><h2>שבוע רגיל</h2>
  <table>
    <tr><td>ראשון</td><td><span class="wk k-easy">ריצה קלה</span></td></tr>
    <tr><td>שני</td><td><span class="wk k-cf">קרוספיט</span></td></tr>
    <tr><td>שלישי</td><td><span class="wk k-q">אימון איכות</span> (אינטרוולים / טמפו)</td></tr>
    <tr><td>רביעי</td><td><span class="wk k-swim">טכניקת שחייה</span> בבוקר + <span class="wk k-cf">קרוספיט</span> בערב</td></tr>
    <tr><td>חמישי</td><td><span class="wk k-easy">ריצה בינונית</span>, לפעמים עם קטע בקצב מרתון</td></tr>
    <tr><td>שישי</td><td><span class="wk k-cf">קרוספיט</span> בלי רגליים כבדות</td></tr>
    <tr><td>שבת</td><td><span class="wk k-long">ריצה ארוכה</span> בבוקר + <span class="wk k-swim">שחייה</span> אחה״צ</td></tr>
  </table>
</section>
<details class="rules"><summary>כללים לקרוספיט ולשחייה ${CHEV_L}</summary>
  <ul>
    <li><b>קרוספיט בשישי ולא בשבת.</b> ארוכה, שחייה וקרוספיט באותו יום זה יותר מדי, ואחרי ארוכה של 25 ק״מ ומעלה הרגליים לא יהיו שם. אם שישי לא מתאים, אפשר להעביר לחמישי בערב.</li>
    <li><b>שחייה:</b> טכניקה ברביעי בבוקר, והאימון העיקרי בשבת אחה״צ (סטים בקצב CSS, שחיות רצופות, וחזרה גנרלית של 4 ק״מ ב־26.12). בשבתות עם ארוכה של 24 ק״מ ומעלה השחייה קלה.</li>
    <li><b>קרוספיט בשישי בלי עבודת רגליים כבדה</b> (סקוואט כבד, קפיצות בנפח גבוה, ריצות בתוך WOD). הדגש על פלג גוף עליון, ליבה ושרשרת אחורית קלה.</li>
    <li><b>מדצמבר (שבוע 11 והלאה)</b> מורידים עוצמה ברגליים בכל הקרוספיט: משקלים בינוניים, בלי חזרות עד כשל.</li>
    <li><b>לא עושים קרוספיט ביום של ריצת איכות,</b> ויום לפני אימון איכות לא עושים רגליים קשות.</li>
    <li><b>שבועות הורדה (4, 9, 13, 18):</b> גם הקרוספיט בעוצמה בינונית.</li>
    <li><b>כאב שלא עובר אחרי יום מנוחה:</b> מחליפים את הריצה הבאה בשחייה או במנוחה, ולא ״משלימים״ אחר כך.</li>
  </ul>
</details>`;

/* ---------- result sheet ---------- */
let sheetId = null, sheetRpe = 0;
function openLog(id){
  const it = itemById(id); if (!it) return;
  sheetId = id;
  const lg = LOGS.data[id] || {}, t = logType(it);
  sheetRpe = lg.rpe || 0;
  const d = dayDate(it.wi, it.di);
  const fields = t === 'cf' ? `<label class="fl">משך<input class="in" id="f-time" placeholder="למשל 60:00" inputmode="numeric"></label>`
    : `<label class="fl">${t === 'swim' ? 'מרחק (מ׳)' : 'מרחק (ק״מ)'}<input class="in" id="f-dist" inputmode="decimal" placeholder="${t === 'swim' ? '2000' : (it.km || 5)}"></label>
       <label class="fl">זמן<input class="in" id="f-time" inputmode="numeric" placeholder="${t === 'swim' ? '48:30' : '28:30'}"></label>
       <label class="fl">דופק ממוצע<input class="in" id="f-hr" inputmode="numeric" placeholder="145"></label>`;
  const el = document.createElement('div');
  el.className = 'sheet-bg'; el.id = 'sheetbg';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="sh-head"><div><div class="eyebrow">יום ${DN[it.di]} <span class="num">${fmt(d)}</span> · שבוע <span class="num">${it.wi+1}</span></div><h2 id="sh-t" class="k-${it.k}">${LONG[it.k]}</h2><p class="meta">מתוכנן: ${it.t}</p></div>
      <button class="iconbtn" data-sh="close" aria-label="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="fields">${fields}</div>
    ${t === 'cf' ? '' : '<div class="pace" id="f-pace"></div>'}
    <div><div class="fl">מאמץ (1–10)</div><div class="rpe" id="f-rpe">${Array.from({length:10}, (_, i) => `<button data-rpe="${i+1}" aria-pressed="${sheetRpe === i+1}">${i+1}</button>`).join('')}</div><div class="rpe-hint"><span>קל מאוד</span><span>מקסימלי</span></div></div>
    <label class="fl">הערות<textarea class="in" id="f-note" rows="3" placeholder="איך הרגיש, ספליטים, כאבים, חום, רוח"></textarea></label>
    <div class="sh-act"><button class="btn pri" data-sh="send">שמירה ושליחה למאמן</button><button class="btn sec" data-sh="save">שמירה</button>${LOGS.data[id] ? '<button class="btn del" data-sh="del">מחיקת התוצאה</button>' : ''}</div>
  </div>`;
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  const set = (i, v) => { const x = document.getElementById(i); if (x && v != null) x.value = v; };
  set('f-dist', lg.dist); set('f-time', lg.time); set('f-hr', lg.hr); set('f-note', lg.note);
  const upPace = () => { const p = document.getElementById('f-pace'); if (!p) return; const dv = document.getElementById('f-dist'), tv = document.getElementById('f-time'); const pc = paceOf(t, dv.value, tv.value); p.textContent = pc ? 'קצב: ' + pc : ''; };
  upPace();
  el.addEventListener('input', upPace);
  el.addEventListener('click', e => {
    if (e.target === el) return closeLog();
    const r = e.target.closest('[data-rpe]');
    if (r) { const v = +r.dataset.rpe; sheetRpe = sheetRpe === v ? 0 : v; el.querySelectorAll('[data-rpe]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.rpe === sheetRpe)); return; }
    const a = e.target.closest('[data-sh]'); if (!a) return;
    const act = a.dataset.sh;
    if (act === 'close') closeLog();
    else if (act === 'del') { delete LOGS.data[sheetId]; LOGS.save(); closeLog(); render(); }
    else saveLog(act === 'send');
  });
}
function closeLog(){ const el = document.getElementById('sheetbg'); if (el) el.remove(); document.body.style.overflow = ''; sheetId = null; }
function saveLog(send){
  const id = sheetId, it = itemById(id); if (!it) return;
  const g = i => { const x = document.getElementById(i); return x ? x.value.trim() : ''; };
  const lg = {};
  const dist = g('f-dist').replace(',', '.'); if (dist && !isNaN(parseFloat(dist))) lg.dist = String(parseFloat(dist));
  const time = g('f-time'); if (time && parseTime(time)) lg.time = fmtDur(parseTime(time));
  const hr = g('f-hr'); if (hr && +hr) lg.hr = String(Math.round(+hr));
  if (sheetRpe) lg.rpe = sheetRpe;
  const note = g('f-note'); if (note) lg.note = note.slice(0, 1000);
  const has = Object.keys(lg).length;
  if (has) { lg.ts = Date.now(); LOGS.data[id] = lg; } else delete LOGS.data[id];
  LOGS.save();
  if (has && !DONE.data[id]) { DONE.data[id] = true; DONE.save(); justId = id; }
  closeLog();
  if (send && has) {
    cmode = 'last'; go('coach');
    shareText(resultMsg(id));   // still inside the tap, so the share sheet is allowed to open
  } else render();
}

/* ---------- shell ---------- */
const main = document.getElementById('main');
function render(){
  main.innerHTML = view === 'today' ? vToday() : view === 'week' ? vWeek() : view === 'plan' ? vPlan() : view === 'coach' ? vCoach() : PACE_HTML;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.view === view ? 'page' : 'false'));
  document.getElementById('ovr').textContent = pct(overall().c, TOTAL) + '%';
  justId = null;
}
function go(v){
  view = v; try { localStorage.setItem('tlv27view', v); } catch(e) {}
  render(); window.scrollTo(0, 0);
}
function step(n){
  let i = selW*7 + selD + n;
  i = Math.max(0, Math.min(NW*7 - 1, i));
  selW = Math.floor(i/7); selD = i % 7; render();
}
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  if (b.dataset.view === 'week' && view !== 'week') viewW = selW;
  go(b.dataset.view);
});
main.addEventListener('change', e => {
  if (e.target.id !== 'impin') return;
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (f) importBackup(f);
});
let armT = null;
main.addEventListener('click', e => {
  const lgb = e.target.closest('[data-log]');
  if (lgb) { openLog(lgb.dataset.log); return; }
  const t = e.target.closest('[data-id],[data-act]'); if (!t) return;
  if (t.dataset.id) {
    const id = t.dataset.id;
    if (DONE.data[id]) delete DONE.data[id]; else { DONE.data[id] = true; justId = id; if (navigator.vibrate) try { navigator.vibrate(12); } catch(_) {} }
    DONE.save(); render(); return;
  }
  const a = t.dataset.act;
  if (a === 'dprev') step(-1);
  else if (a === 'dnext') step(1);
  else if (a === 'gotoday') { selW = TP.wi; selD = TP.di; render(); }
  else if (a === 'day') { selD = +t.dataset.d; render(); }
  else if (a === 'wprev') { viewW = Math.max(0, viewW-1); render(); }
  else if (a === 'wnext') { viewW = Math.min(NW-1, viewW+1); render(); }
  else if (a === 'wk') { viewW = +t.dataset.w; go('week'); }
  else if (a === 'open') { selW = +t.dataset.w; selD = +t.dataset.d; go('today'); }
  else if (a === 'mode') { cmode = t.dataset.m; render(); }
  else if (a === 'share') { const b = document.getElementById('sumbox'); if (b) shareText(b.value); }
  else if (a === 'copy') { const b = document.getElementById('sumbox'); if (b) copyText(b.value); }
  else if (a === 'export') { exportBackup(); }
  else if (a === 'hintx') { try { localStorage.setItem('tlv27hint', '1'); } catch(e) {} render(); }
  else if (a === 'import') {
    const has = Object.keys(DONE.data).length || Object.keys(LOGS.data).length;
    if (!has || t.classList.contains('arm')) { clearTimeout(armT); t.classList.remove('arm'); t.textContent = 'שחזור מגיבוי'; document.getElementById('impin').click(); }
    else { t.classList.add('arm'); t.textContent = 'ללחוץ שוב: יחליף את מה שיש עכשיו'; armT = setTimeout(() => { t.classList.remove('arm'); t.textContent = 'שחזור מגיבוי'; }, 4000); }
  }
  else if (a === 'reset') {
    if (t.classList.contains('arm')) { clearTimeout(armT); DONE.data = {}; DONE.save(); render(); }
    else { t.classList.add('arm'); t.textContent = 'ללחוץ שוב כדי למחוק הכל'; armT = setTimeout(() => { t.classList.remove('arm'); t.textContent = 'איפוס כל הסימונים'; }, 3000); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetId) closeLog(); });
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
